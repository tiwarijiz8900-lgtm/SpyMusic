services:
  - type: web
    name: spy-music-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m SpyMusic
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: OWNER_ID
        sync: false
      - key:LOGGER_ID
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: PORT
        value: 8000
